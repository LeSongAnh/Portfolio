version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: devcms-portfolio-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    # Tải trước các biến môi trường từ file .env.local nếu có sẵn ngoài thư mục chạy lệnh
    env_file:
      - .env.local
